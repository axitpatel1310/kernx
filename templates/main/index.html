{% extends "base.html" %}
{% block content %}
{% if arcs %}
{% for i in arcs %}
    <div class="modal-card">
        <div class="modal-header">
            <h3>{{i.name}}</h3>
        </div>
        <div class="modal-body">
            <p><b>Original Title: </b><i>{{i.original.title}}</i></p>
            <p><b>Updated On: </b><i>{{i.updated_at}}</i></p>
            <p><b>Category: </b><i>{{i.original.type}}</i></p>
        </div>
        <div class="modal-footer">
            <a href="{% url "user-architecture-detail" i.id %}">
                <button class="btn btn-secondary" class="btn btn-primary">View</button>
            </a>
            <a id="confirmDeleteBtn" href="#" class="btn btn-danger">Confirm Delete</a>
        </div>
    </div>

{% endfor %}
{% endif %}

{% endblock content %}
