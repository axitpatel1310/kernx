{% extends 'base.html' %}

{% block title %}KernxTech | Check Your Email{% endblock title %}

{% block content %}
<div class="auth-container">
    <div class="auth-card" style="text-align: center;">
        <div class="auth-header">
            <i class="fa-solid fa-paper-plane" style="color: var(--color-soft-sage);"></i>
            <h2>Check Your Email</h2>
            <p>If an account exists with that email address, we've sent you a password reset link.</p>
        </div>

        <div style="margin-top: 2rem;">
            <a href="{% url 'login' %}" class="btn btn-primary" style="width: 100%; justify-content: center;">
                <i class="fa-solid fa-arrow-left"></i> Back to Login
            </a>
        </div>
    </div>
</div>
{% endblock content %}
