{% extends 'base.html' %}

{% block title %}KernxTech | Password Changed{% endblock title %}

{% block content %}
<div class="auth-container">
    <div class="auth-card" style="text-align: center;">
        <div class="auth-header">
            <i class="fa-solid fa-circle-check" style="color: var(--color-soft-sage);"></i>
            <h2>Password Updated</h2>
            <p>Your password has been changed successfully.</p>
        </div>

        <div style="margin-top: 2rem;">
            <a href="{% url 'login' %}" class="btn btn-primary" style="width: 100%; justify-content: center;">
                <i class="fa-solid fa-right-to-bracket"></i> Proceed to Login
            </a>
        </div>
    </div>
</div>
{% endblock content %}
